name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests (offline, fixture-based)
        run: uv run pytest

      - name: Generate offline demonstration report
        run: uv run python examples/demo.py

      - uses: actions/upload-artifact@v4
        with:
          name: sample-quality-report
          path: reports/demo/
