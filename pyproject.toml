[project]
name = "market-data-quality"
version = "0.1.0"
description = "Data-quality pipeline for daily OHLCV market data: two-source ingestion, vendor-defect checks, and human-readable reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
    "requests>=2.34.2",
    "yfinance>=1.5.1",
]

[project.scripts]
dq = "market_data_quality.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_data_quality"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
